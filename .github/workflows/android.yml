name: Android application

on:
  push:
    paths: ['app/**', 'service-contract/**', 'vehicle-catalog/vehicle-list.json', 'service-engine/**', 'scripts/**', 'gradle/**', 'gradlew*', '*.gradle.kts', 'gradle.properties', '.github/workflows/android.yml']
  pull_request:
    paths: ['app/**', 'service-contract/**', 'vehicle-catalog/vehicle-list.json', 'service-engine/**', 'scripts/**', 'gradle/**', 'gradlew*', '*.gradle.kts', 'gradle.properties', '.github/workflows/android.yml']

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: ./gradlew :service-contract:test :service-engine:check :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      # The store package (unsigned here: the upload key is never in the repository) must build on every change,
      # and its native libraries must keep working with 16 KB memory pages, which Google Play requires.
      - run: ./gradlew :app:bundleRelease
      - run: python3 scripts/check_native_alignment.py app/build/outputs/apk/debug/app-debug.apk app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-foundation
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/reports/
            app/build/test-results/testDebugUnitTest/
            service-contract/build/reports/tests/
            service-contract/build/test-results/
            service-engine/build/reports/tests/
            service-engine/build/test-results/
          retention-days: 7
  device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true
            python3 scripts/check_process_restart.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-tests
          path: |
            app/build/reports/androidTests/
            app/build/reports/device-smoke/
          retention-days: 7
