name: Android engine integration

on:
  push:
    paths: ['app/**', 'service-contract/**', 'gradle/**', 'gradlew*', '*.gradle.kts', 'gradle.properties', '.github/engine-integration.ref', '.github/workflows/engine-integration.yml']
  pull_request:
    paths: ['app/**', 'service-contract/**', 'gradle/**', 'gradlew*', '*.gradle.kts', 'gradle.properties', '.github/engine-integration.ref', '.github/workflows/engine-integration.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read the pinned engine revision
        id: engine
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          sha = Path('.github/engine-integration.ref').read_text().strip()
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('Expected one immutable engine commit SHA')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'sha={sha}\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.engine.outputs.sha }}
          path: .integration/engine-source
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Room to engine integration and both Kotlin test suites
        run: ./gradlew :service-contract:test :app:testDebugUnitTest :service-engine:check -PengineIntegrationRoot="$GITHUB_WORKSPACE/.integration/engine-source"
      - name: Record both source revisions
        if: always()
        env:
          APP_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ENGINE_HEAD_SHA: ${{ steps.engine.outputs.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          out = Path('app/build/reports/engine-integration')
          out.mkdir(parents=True, exist_ok=True)
          (out / 'revisions.json').write_text(json.dumps({
              'app_head': os.environ['APP_HEAD_SHA'],
              'engine_head': os.environ['ENGINE_HEAD_SHA'],
              'production_engine_dependency': False,
          }, indent=2) + '\n')
          PY
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real engine and archive runtime on minimum Android API 26
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest -PengineIntegrationRoot="$GITHUB_WORKSPACE/.integration/engine-source" -Pandroid.testInstrumentationRunnerArguments.class=app.servicepassport.android.integration.EngineAndroidSmokeTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: room-engine-integration
          include-hidden-files: true
          path: |
            app/build/reports/tests/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/androidTests/
            app/build/reports/engine-integration/
            .integration/engine-source/service-engine/build/reports/tests/
            .integration/engine-source/service-engine/build/test-results/test/
          retention-days: 7
