name: Minimum Android compatibility

on:
  push:
    paths: ['app/**', 'service-contract/**', 'service-engine/**', 'gradle/**', 'gradlew*', '*.gradle.kts', 'gradle.properties', '.github/workflows/engine-integration.yml']
  pull_request:
    paths: ['app/**', 'service-contract/**', 'service-engine/**', 'gradle/**', 'gradlew*', '*.gradle.kts', 'gradle.properties', '.github/workflows/engine-integration.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Record production source revision
        if: always()
        env:
          APP_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          out = Path('app/build/reports/engine-integration')
          out.mkdir(parents=True, exist_ok=True)
          (out / 'revisions.json').write_text(json.dumps({
              'app_head': os.environ['APP_HEAD_SHA'],
              'engine_import': Path('.github/engine-integration.ref').read_text().strip(),
              'production_engine_dependency': True,
              'engine_source': 'service-engine/ in the same checked-out revision',
          }, indent=2) + '\n')
          PY
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Engine, archive runtime and both archived database upgrades on API 26
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=app.servicepassport.android.integration.EngineAndroidSmokeTest,app.servicepassport.android.UpgradeDatabaseTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: room-engine-integration
          path: |
            app/build/reports/androidTests/
            app/build/reports/engine-integration/
          retention-days: 7
