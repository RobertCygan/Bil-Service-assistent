name: service-engine

on:
  push:
    paths: ["service-engine/**", "service-contract/**", "gradle/libs.versions.toml", ".github/workflows/service-engine.yml"]
  pull_request:
    paths: ["service-engine/**", "service-contract/**", "gradle/libs.versions.toml", ".github/workflows/service-engine.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: ./gradlew build --console=plain
